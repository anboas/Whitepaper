# Rubric used by scripts/rubric_check.py
# Goal: fail PRs that are obviously not publishable yet.
# This is deterministic + heuristic (no LLM). Tune over time.

min_total_score: 0.80

checks:
  # --- Hygiene / structural gates ---
  no_todos:
    weight: 0.10
    patterns: ["TODO", "TBD", "FIXME"]

  required_sections:
    weight: 0.15
    # Minimal structural tokens that should exist in every house-style paper.
    # (More specific per-paper section expectations should come from INTENT.md-driven checks.)
    required_phrases:
      - "\\begin{execsummary}"
      - "\\tableofcontents"

  has_sources_or_refs:
    weight: 0.10
    required_phrases_any: ["References", "Bibliography"]
    min_citation_markers: 2

  length_sanity:
    weight: 0.10
    min_words: 500

  # --- Tone / style heuristics ---
  tone_avoid_hedging:
    weight: 0.10
    # Allow some, but avoid excessive uncertainty/hand-waving.
    max_hits: 12
    patterns:
      - "maybe"
      - "might"
      - "could"
      - "possibly"
      - "somewhat"
      - "sort of"
      - "kind of"
      - "in my opinion"
      - "i think"

  tone_avoid_hype:
    weight: 0.05
    max_exclamations: 1
    # Some caps are normal in technical writing (PDF/HTML/API); keep a ceiling.
    max_allcaps_words: 25

  clarity_sentence_length:
    weight: 0.10
    # In plain text after LaTeX stripping.
    max_avg_words_per_sentence: 24
    max_sentence_words: 45

  clarity_readability:
    weight: 0.10
    # Flesch Reading Ease (approx). 0-100: higher is easier.
    # Business/technical writing often lands ~30-60.
    min_flesch_reading_ease: 25

  voice_prefer_active:
    weight: 0.10
    # Heuristic passive voice detector; keep it low.
    max_passive_ratio: 0.18

  # --- Elements / audience fit ---
  elements_actionability:
    weight: 0.05
    # Ensure recommendations are framed as actions.
    required_phrases_any: ["Adopt", "Require", "Instrument", "Implement", "Establish", "Define"]
    min_hits: 2

  # --- Semantic / subjective checks (OpenAI API; optional) ---
  # Two tiers:
  # - cheap: always-on PR feedback, low-cost model, non-blocking
  # - full: human-triggered (workflow_dispatch), stronger model + stricter bar
  llm_semantic_cheap:
    model: auto
    min_overall: 0.55
    min_per_category: 0.45
    categories:
      - tone
      - clarity
      - structure
      - argument_strength
      - specificity
      - actionability
      - evidence_quality
      - executive_readiness

  llm_semantic_full:
    model: auto
    min_overall: 0.80
    min_per_category: 0.65
    categories:
      - tone
      - clarity
      - structure
      - argument_strength
      - specificity
      - actionability
      - evidence_quality
      - executive_readiness
