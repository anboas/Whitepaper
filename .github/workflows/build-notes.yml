name: build-notes

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - id: set
        run: |
          python3 scripts/list_notes_json.py > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc qpdf poppler-utils

      - name: Validate note metadata
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          slug = "${{ matrix.note }}"
          p = Path(f"writing/notes/{slug}.md")
          if not p.exists():
              raise SystemExit(f"missing {p}")
          raw = p.read_text(encoding="utf-8")
          if not raw.startswith("---\n"):
              raise SystemExit(f"{slug}: missing frontmatter")
          fm = raw.split("---", 2)[1]
          data = yaml.safe_load(fm) or {}
          required = ["title", "date", "summary", "status", "type", "tags", "pdfPath"]
          for k in required:
              if k not in data or data[k] in (None, ""):
                  raise SystemExit(f"{slug}: note frontmatter missing required key: {k}")
          if data["status"] != "published":
              raise SystemExit(f"{slug}: build-notes only receives published notes")
          if data["type"] != "note":
              raise SystemExit(f"{slug}: type must be note")
          if data["pdfPath"] != f"/notes/{slug}.pdf":
              raise SystemExit(f"{slug}: pdfPath must be /notes/{slug}.pdf")
          if not isinstance(data["tags"], list) or not data["tags"]:
              raise SystemExit(f"{slug}: tags must be a non-empty list")
          print(f"note metadata OK: {slug}")
          PY

      - name: Build TeX + HTML
        run: |
          mkdir -p build/notes/${{ matrix.note }}
          python3 scripts/build_note_artifacts.py \
            --input writing/notes/${{ matrix.note }}.md \
            --tex-out build/notes/${{ matrix.note }}/note.tex \
            --html-out build/notes/${{ matrix.note }}/note.html

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build/notes/${{ matrix.note }}/note.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -output-directory=build/notes/${{ matrix.note }}

      - name: Fix build/ permissions
        run: |
          sudo chown -R "$USER":"$USER" build || true
          chmod -R u+rwX build || true

      - name: Optimize PDFs
        run: |
          PDF="build/notes/${{ matrix.note }}/note.pdf"
          test -f "$PDF"
          qpdf --linearize "$PDF" "${PDF%.pdf}.linearized.pdf"
          mv "${PDF%.pdf}.linearized.pdf" "$PDF"

      - name: PDF QA gate
        run: |
          set -euo pipefail
          PDF="build/notes/${{ matrix.note }}/note.pdf"
          test -f "$PDF"
          pdfinfo "$PDF" | sed -n '1,40p'
          TITLE=$(pdfinfo "$PDF" | awk -F: '/^Title:/ {sub(/^ +/,"",$2); print $2}')
          AUTHOR=$(pdfinfo "$PDF" | awk -F: '/^Author:/ {sub(/^ +/,"",$2); print $2}')
          OPTIMIZED=$(pdfinfo "$PDF" | awk -F: '/^Optimized:/ {sub(/^ +/,"",$2); print $2}')
          test -n "$TITLE" || (echo "Missing Title metadata" && exit 1)
          test -n "$AUTHOR" || (echo "Missing Author metadata" && exit 1)
          test "$OPTIMIZED" = "yes" || (echo "PDF not optimized/linearized" && exit 1)
          pdffonts "$PDF" | awk 'NR>2 && $1 != "" {print $4}' | grep -qv "no" || (echo "Non-embedded font detected" && exit 1)
          pdftotext -layout "$PDF" - | head -n 5 | grep -q "[A-Za-z]" || (echo "Text extraction looks empty" && exit 1)

      - name: Site ingestion check
        run: |
          python3 scripts/site_ingestion_check.py \
            --paper-dir writing/notes/${{ matrix.note }} \
            --html build/notes/${{ matrix.note }}/note.html

      - name: Create sync manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/hash_manifest.py \
            --slug "${{ matrix.note }}" \
            --kind note \
            --pdf build/notes/${{ matrix.note }}/note.pdf \
            --html build/notes/${{ matrix.note }}/note.html \
            --source-sha "$SOURCE_SHA" \
            --out build/notes/${{ matrix.note }}/manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: note-${{ matrix.note }}
          path: |
            build/notes/${{ matrix.note }}/note.pdf
            build/notes/${{ matrix.note }}/note.html
            build/notes/${{ matrix.note }}/manifest.json
