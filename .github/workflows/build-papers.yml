name: build-papers

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          python3 scripts/list_papers_json.py > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: UTF-8 sanitize check (LaTeX inputs)
        run: |
          python3 scripts/utf8_latex_sanitize.py --check

      - name: Validate INTENT
        run: |
          python scripts/intent_validate.py --paper-dir papers/${{ matrix.paper }}

      - name: Rubric gate (deterministic)
        run: |
          python scripts/rubric_check.py --paper-dir papers/${{ matrix.paper }} --tex tex/paper.tex --rubric rubric.yml

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: papers/${{ matrix.paper }}/tex/paper.tex
          # latexmk defaults to DVI unless -pdf is specified.
          args: -pdf -interaction=nonstopmode -halt-on-error -output-directory=build/${{ matrix.paper }}

      - name: Fix build/ permissions
        run: |
          sudo chown -R "$USER":"$USER" build || true
          chmod -R u+rwX build || true

      - name: Install build tools (qpdf + pandoc + poppler-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf pandoc poppler-utils

      - name: Optimize PDFs (linearize)
        run: |
          for pdf in build/${{ matrix.paper }}/*.pdf; do
            [ -f "$pdf" ] || continue
            qpdf --linearize "$pdf" "${pdf%.pdf}.linearized.pdf"
            mv "${pdf%.pdf}.linearized.pdf" "$pdf"
          done

      - name: PDF QA gate
        run: |
          set -euo pipefail
          PDF="build/${{ matrix.paper }}/paper.pdf"
          test -f "$PDF"

          echo "== pdfinfo =="
          pdfinfo "$PDF" | sed -n '1,40p'

          # Metadata must be present (non-empty)
          TITLE=$(pdfinfo "$PDF" | awk -F: '/^Title:/ {sub(/^ +/,"",$2); print $2}')
          AUTHOR=$(pdfinfo "$PDF" | awk -F: '/^Author:/ {sub(/^ +/,"",$2); print $2}')
          OPTIMIZED=$(pdfinfo "$PDF" | awk -F: '/^Optimized:/ {sub(/^ +/,"",$2); print $2}')
          test -n "$TITLE" || (echo "Missing Title metadata" && exit 1)
          test -n "$AUTHOR" || (echo "Missing Author metadata" && exit 1)
          test "$OPTIMIZED" = "yes" || (echo "PDF not optimized/linearized" && exit 1)

          echo "== pdffonts =="
          pdffonts "$PDF" | head -n 50

          # Fonts should be embedded (emb column)
          # pdffonts columns: name type encoding emb sub uni object ID
          pdffonts "$PDF" | awk 'NR>2 && $1 != "" {print $4}' | grep -qv "no" || (echo "Non-embedded font detected" && exit 1)

          echo "== pdftotext head =="
          pdftotext -layout "$PDF" - | head -n 10

          # Text extraction should produce something
          pdftotext -layout "$PDF" - | head -n 5 | grep -q "[A-Za-z]" || (echo "Text extraction looks empty" && exit 1)

      - name: Build HTML (pandoc)
        run: |
          mkdir -p build/${{ matrix.paper }}

          # Produce a standalone HTML file first, then extract a stable body-only fragment.
          python3 scripts/pandoc_preprocess_tex.py \
            papers/${{ matrix.paper }}/tex/paper.tex \
            /tmp/pandoc_${{ matrix.paper }}.tex

          pandoc /tmp/pandoc_${{ matrix.paper }}.tex \
            -s \
            -t html5 \
            --metadata title="${{ matrix.paper }}" \
            -o build/${{ matrix.paper }}/paper.full.html

          python3 scripts/extract_pandoc_body.py \
            build/${{ matrix.paper }}/paper.full.html \
            build/${{ matrix.paper }}/paper.html

      - name: Site ingestion check (HTML safety)
        run: |
          python3 scripts/site_ingestion_check.py --paper-dir papers/${{ matrix.paper }}

      - name: Create sync manifest (sha256)
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/hash_manifest.py \
            --paper "${{ matrix.paper }}" \
            --pdf build/${{ matrix.paper }}/paper.pdf \
            --html build/${{ matrix.paper }}/paper.html \
            --source-sha "$SOURCE_SHA" \
            --out build/${{ matrix.paper }}/manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.paper }}
          path: |
            build/${{ matrix.paper }}/*.pdf
            build/${{ matrix.paper }}/*.html
            build/${{ matrix.paper }}/manifest.json
