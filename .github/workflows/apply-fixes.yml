name: apply-fixes

on:
  pull_request:
    types: [labeled]

jobs:
  apply:
    if: github.event.label.name == 'apply-fixes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Apply FIX: comments (LLM) iteratively
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # TODO: once apply_fixes_from_pr.py is made iterative, we can enable max_iters here.
          python scripts/apply_fixes_from_pr.py --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: `Applied \`FIX:\` comments (attempted). Check the Actions logs for details. If nothing changed, either no \`FIX:\` comments were found or the patch could not be applied cleanly.`
            });
          result-encoding: string
