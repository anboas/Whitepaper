name: quality-analysis

on:
  pull_request:

jobs:
  cheap_model_analysis:
    # Run only after deterministic gates and build succeed in the main workflow.
    # We keep this as a separate workflow to avoid blocking builds and to keep costs contained.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Low-cost semantic rubric (optional; runs only if key is present)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/llm_rubric_check.py --tex tex/whitepaper.tex --rubric rubric.yml --tier cheap
