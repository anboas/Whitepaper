name: full-review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment on"
        required: true
        type: string

jobs:
  full_semantic_review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run full semantic rubric
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/llm_rubric_check.py --tex tex/whitepaper.tex --rubric rubric.yml --tier full | tee full_review.txt

      - name: Comment on PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = parseInt(core.getInput('pr_number'), 10);
            const body = fs.readFileSync('full_review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: `## Full semantic review (LLM)\n\n\`\`\`\n${body}\n\`\`\`\n\nNext step: apply fixes in a new commit and re-run deterministic gates.`
            });
          result-encoding: string
