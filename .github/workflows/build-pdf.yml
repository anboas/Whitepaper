name: build-pdf

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles LaTeX into build/whitepaper.pdf
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tex/whitepaper.tex
          args: -interaction=nonstopmode -halt-on-error -output-directory=build

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: build/*.pdf
