name: build-whitepaper

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install rubric deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Rubric gate (fails if draft is not publishable yet)
        run: |
          python scripts/rubric_check.py --tex tex/whitepaper.tex --rubric rubric.yml

      # Compiles LaTeX into build/whitepaper.pdf
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tex/whitepaper.tex
          args: -interaction=nonstopmode -halt-on-error -output-directory=build

      # latex-action may create build/ as root (depending on container execution);
      # ensure subsequent steps can write into it.
      - name: Fix build/ permissions
        run: |
          sudo chown -R "$USER":"$USER" build || true
          chmod -R u+rwX build || true

      - name: Build HTML (pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          mkdir -p build
          pandoc tex/whitepaper.tex -s --metadata title="Whitepaper" -o build/whitepaper.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-build
          path: |
            build/*.pdf
            build/*.html
