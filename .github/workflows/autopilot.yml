name: autopilot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autopilot:
    # Only run when a paper has AUTOPILOT.yml with autonomous=true.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Configure git
        run: |
          git config user.name "moltbot"
          git config user.email "moltbot@users.noreply.github.com"

      - name: Autopilot polish (iterative)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/autopilot_pr.py --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}

      - name: Merge PR if clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            // Re-check mergeability and CI status; only merge if mergeable and not a draft.
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            if (data.draft) {
              core.info('PR is draft; not merging.');
              return;
            }
            // Attempt squash merge; will fail if branch protection blocks it.
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              merge_method: 'squash'
            });
